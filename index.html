.ft b{will-change:bottom}

/* kartu: strip merah di kiri, judul tanpa pita */
.c{border-radius:16px;border:1px solid #2a1414;border-left:4px solid var(--fe);background:linear-gradient(160deg,#151516,#09090a);box-shadow:0 10px 26px -10px #000,0 0 0 1px #00000060}
.t{background:transparent;border:0;box-shadow:none;padding:2px var(--pd) 8px;margin-bottom:6px;color:var(--sil);font-size:12px;letter-spacing:.22em}
.t::before{width:16px;height:4px;border-radius:1px;background:var(--fe)!important;box-shadow:0 0 10px var(--fe)!important;transform:skewX(-28deg);margin-right:10px}
/* tombol: pil, gaya miring seperti logo */
.btn,.hbt,nav button,.ar{border-radius:999px;border:1px solid #3a2a2a;background:linear-gradient(#26262a,#141416);box-shadow:inset 0 1px #ffffff1c,0 2px 6px #000b}
.btn.on,.btn.tg.on,nav .on,.btn.big,.btn.ch.on{background:linear-gradient(#ff5a52,#d8201c 55%,#a60f0c);border-color:#ff9a94;color:#fff;text-shadow:0 1px 2px #0008;box-shadow:inset 0 1px #ffffff66,0 0 16px #ff2a2a77,0 2px 6px #000b}
.sp .btn.tg,.sp .btn.tg.on{background:linear-gradient(#e8e9ec,#aeb2b9);color:#111;border-color:#fff;box-shadow:0 0 10px #ffffff44}
.sp{border-radius:14px;border-top:0;border-bottom:3px solid var(--fe)}
.mix .sp{border-top-color:transparent}
/* slider: trek tipis, kenop bulat perak */
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px}
input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-10px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#ff2a2a 0 28%,#f4f5f7 30%,#9ea3ab 100%)!important;box-shadow:0 3px 8px #000d,inset 0 1px #fff,0 0 0 1px #000}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#ff2a2a 0 28%,#f4f5f7 30%,#9ea3ab 100%)}
input[type=range]{height:34px}
.sl output,.sv,.xb{border-radius:999px;color:#ffd9d6;text-shadow:0 0 8px #ff2a2a99}
/* login: logo di tengah, tombol Scan di bawah logo */
#sc{justify-content:center;gap:12px;background:radial-gradient(70% 45% at 50% 100%,#8a100c88,transparent 70%),radial-gradient(60% 40% at 50% 0,#ffffff10,transparent 70%),#000}
.scm{order:1;flex:none;padding:0 6%}.scm .lgw,.scm .lgw img{max-height:42vh}
.sct{order:2;flex-direction:column;justify-content:center;padding:0 16px;gap:12px}
.scl{flex:none;flex-direction:column;align-items:center;gap:2px;text-align:center}
.scl b{font-size:15px;letter-spacing:.3em;color:#bfc3c9;font-weight:500}
#sbt{width:min(80vw,340px);border-radius:999px;font-style:italic}
#srt{order:3}.scb{order:4;flex-direction:column;padding-top:4px}
#spin{border-radius:999px;width:min(60vw,200px)}
#ssk{background:transparent;border:0;color:#8a8e95;text-decoration:underline;font-size:12px}
/* PORTRAIT: header ramping, tab bawah jadi dock melayang */
@media not all and (orientation:landscape) and (min-width:640px){
 header{background:linear-gradient(#000,#120404);border:0;border-radius:0 0 22px 22px;box-shadow:0 8px 24px #000c,0 2px 0 var(--fe)}
 header #lg{flex:none!important;max-width:none}header .top svg,header .top img{height:36px!important;max-width:120px!important}
 header .top{gap:5px!important;padding:6px!important}
 header .pn{flex:0 0 auto!important}header #dot{font-size:7px!important;padding:1px 4px!important}
 header .hbt{padding:0 7px!important;font-size:9px!important}header .ib{width:28px!important;height:28px!important}header #hb{gap:3px!important}
 header .pn b{display:none}
 nav{padding:2px 10px 10px}
 #bn{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;gap:4px;border:1px solid #ff2a2a44;border-radius:24px;background:#0a0a0bdd;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 12px 30px #000e,0 0 24px #ff2a2a22}
 #bn button{height:40px;padding-top:0;border-radius:18px;border:0;background:transparent;box-shadow:none;color:#9a9ea5}
 #bn button::before{display:none}
 #bn .on{background:linear-gradient(#ff4a43,#b3120f);color:#fff;box-shadow:0 0 16px #ff2a2a88,inset 0 1px #ffffff55}
 main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
}
/* LANDSCAPE: header jadi sidebar kiri, konten di kanan */
@media(orientation:landscape) and (min-width:640px){
 header{position:fixed!important;left:0;top:0;bottom:0;width:178px;display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:12px!important;padding:12px 10px!important;overflow-y:auto;background:linear-gradient(180deg,#000,#140404);border:0;border-right:2px solid var(--fe);box-shadow:6px 0 22px #000c,2px 0 14px #ff2a2a33}
 .top{flex-direction:column!important;align-items:stretch!important;gap:8px!important;flex:none!important;width:100%}
 header #lg,header #lg img{width:100%;max-width:none!important;height:auto!important}
 .pn{flex:none!important;align-items:flex-start}.pn b{display:block!important;font-size:12px;letter-spacing:.2em;color:#cfd2d8}
 #hb{flex-direction:column!important;align-items:stretch!important;width:100%}.hbt{width:100%;min-height:36px}.lw{display:inline!important}
 header nav{flex-direction:column!important;flex:none!important;overflow:visible!important;padding:6px 0 0!important;gap:6px!important;border-top:1px solid #2a1414}
 header nav button{width:100%;text-align:left;padding:9px 14px!important}
 main{margin-left:178px;padding:8px 12px calc(48px + env(safe-area-inset-bottom))}
 #bn{left:178px;padding:4px 10px;border-top:1px solid #ff2a2a66;background:#050505ee}
 .hg{height:calc(100vh - 64px);height:calc(100dvh - 64px)}
 header .w{width:100%;max-width:100%;box-sizing:border-box;white-space:normal;overflow:hidden}
 #v[data-t=xo]>.c.gx{top:8px}.c:has(>.cw)>.cw{top:8px}
}

header .wa{height:auto!important;min-height:34px;padding-top:5px!important;padding-bottom:5px!important;width:100%;box-sizing:border-box}
header .wa .wal{white-space:normal!important;min-width:0}
header .wa .wr i{white-space:nowrap}header .wa .wr{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 6px}
header .wa em{font:italic 600 8.5px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#ffd0cc;letter-spacing:.02em}

#swa{order:5;display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 16px 0;padding:14px 18px;border:1px solid #ff2a2a66;border-radius:18px;background:linear-gradient(#150606,#0a0303);box-shadow:0 0 22px #ff2a2a22;text-align:center}
#swa b{font:800 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.14em;color:#e6e8ec}
#swa .swn{font:800 22px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.04em;color:#7be09a;white-space:nowrap}
#swa .swn::before{content:'';display:inline-block;width:22px;height:22px;margin-right:8px;vertical-align:-4px;background:#25d366;border-radius:50%}
#swa em{font:italic 700 20px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#ffd0cc}
@media(orientation:landscape){#swa{display:none}}
.scm .lgw img{filter:none!important;mix-blend-mode:screen}
